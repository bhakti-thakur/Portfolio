<svg
  width="70"
  height="70"
  viewBox="0 0 20 20"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect
    x="4"
    y="3"
    width="12"
    height="14"
    rx="2"
    stroke="#61DAFB"
    strokeWidth="1.2"
  />

  <g
    transform="translate(10 10) scale(0.45)"
    stroke="#61DAFB"
    fill="none"
  >
    <ellipse rx="8" ry="3" strokeWidth="1" />
    <ellipse rx="8" ry="3" strokeWidth="1" transform="rotate(60)" />
    <ellipse rx="8" ry="3" strokeWidth="1" transform="rotate(120)" />
    <circle r="1.5" fill="#61DAFB" />
  </g>
</svg>
